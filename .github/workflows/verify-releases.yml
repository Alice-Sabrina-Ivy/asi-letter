name: Verify OpenPGP clear-signed releases
# Safety net on every push and pull request, on any branch. gnupg is preinstalled
# on the runner image.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify fingerprints and signatures
        run: bash scripts/verify-clearsign.sh
