name: releases-manifest
on:
  push:
    paths:
      - "letter/**"
      - "keys/**"
      # Every pipeline stage, not just the manifest generator. Listing only
      # gen_releases_manifest.py meant a change to any of the other five stages
      # (sync, metadata, render, publish, discovery) never regenerated anything,
      # so the committed artifacts silently stopped matching the code that
      # produces them until some unrelated push happened to trigger a run.
      - "scripts/**"
      - ".github/scripts/generated_paths.sh"
  workflow_run:
    workflows:
      - ots-stamp-letter-asc
    types:
      - completed
  workflow_dispatch: {}

concurrency:
  group: letter-artifacts-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  # actions: write is required to dispatch auto-release-latest-letter.yml below.
  actions: write

jobs:
  build:
    if: ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[manifest-auto]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
      - name: Rebase onto latest ${{ github.ref_name }} before regenerating artifacts
        shell: bash
        run: |
          set -euo pipefail
          branch="${TARGET_BRANCH:-${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}}"
          if [[ -z "${branch}" ]]; then
            echo "Unable to determine branch name from TARGET_BRANCH/GITHUB_REF/GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch origin "$branch"
          git pull --rebase --autostash origin "$branch"
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y gnupg
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install markdown
      - name: Snapshot working tree before regenerating
        run: |
          git status --porcelain --untracked-files=all > /tmp/tree-before.txt
      - name: Regenerate release artifacts
        run: |
          python3 scripts/release.py
      - name: Verify release artifacts are clean
        run: |
          python3 scripts/release.py --check
      - name: Verify every regenerated path is covered by the commit step
        run: |
          bash .github/scripts/assert_generated_paths.sh --baseline /tmp/tree-before.txt
      - name: Refresh site version metadata from manifest
        run: |
          python3 scripts/update_version_metadata.py --manifest letter/RELEASES.json docs/index.html
      - name: Validate site version metadata
        run: |
          python3 scripts/update_version_metadata.py --manifest letter/RELEASES.json --check docs/index.html
      - name: Show working tree changes
        run: |
          set -euo pipefail
          read -r -a paths <<< "$(.github/scripts/generated_paths.sh)"
          git status --short
          git diff --stat -- "${paths[@]}"
      - name: Wait for GitHub Pages to be idle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_FOR_PAGES_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: .github/scripts/wait_for_pages_idle.sh
      - name: Commit refreshed artifacts
        id: commit
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          set -euo pipefail
          branch="${TARGET_BRANCH:-${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}}"
          if [[ -z "${branch}" ]]; then
            branch="main"
          fi
          # Single source of truth for what the pipeline generates. Hardcoding a
          # subset here previously meant regenerated artifacts were committed for
          # some paths and silently discarded for the rest.
          read -r -a paths <<< "$(.github/scripts/generated_paths.sh)"
          dirty=0
          # --porcelain (not `git diff`) so newly created, still-untracked
          # generated files count as changes too.
          if [[ -n "$(git status --porcelain --untracked-files=all -- "${paths[@]}")" ]]; then
            dirty=1
          fi
          if [[ "${dirty}" == "1" ]]; then
            echo "Changes detected:"
            git status --short
            # --stageable: a generated path that was deliberately removed (a pruned
            # .ots awaiting its proof) is absent AND untracked, and git add aborts
            # on an unmatched pathspec, which would drop the entire commit.
            read -r -a add_paths <<< "$(.github/scripts/generated_paths.sh --stageable)"
            git add -A -- "${add_paths[@]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(manifest): refresh release assets [manifest-auto]"
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            git push origin "HEAD:${branch}"
            echo "committed=1" >> "$GITHUB_OUTPUT"
          else
            echo "No release artifacts changed; skipping commit."
            echo "committed=0" >> "$GITHUB_OUTPUT"
          fi

      # auto-release-latest-letter.yml documents a push trigger on
      # letter/RELEASES.json as its safety net. That trigger can never fire:
      # RELEASES.json is only ever written by this job, pushed with GITHUB_TOKEN,
      # and GitHub deliberately does not start workflow runs from GITHUB_TOKEN
      # pushes. The documented fallback therefore did not exist. Dispatch it
      # explicitly instead, exactly as ots-upgrade.yml already does.
      - name: Trigger auto-release (only when the manifest actually changed)
        if: steps.commit.outputs.committed == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          # Scope to the branch this run operated on. Without --ref, gh dispatches
          # against the default branch, so a feature-branch run would republish
          # main's GitHub Release from unrelated content.
          branch="${TARGET_BRANCH:-${GITHUB_REF_NAME}}"
          if [[ "$branch" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Not the default branch ($branch); skipping auto-release dispatch."
            exit 0
          fi
          gh workflow run auto-release-latest-letter.yml --repo "${{ github.repository }}" --ref "$branch"
