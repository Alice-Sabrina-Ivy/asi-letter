name: archive-release

# Keeps the public archives current without anyone remembering to do it.
#
# Triggers, in order of importance:
#   workflow_call      release.yml calls this after deploying a new release or an
#                      upgraded proof, so the Wayback Machine captures the new site.
#                      (It used to run on the upload push itself, before the site
#                      was regenerated, and archived the previous release.)
#   weekly             scheduled.yml calls it as a safety net, so the archives
#                      stay fresh even if a submission was dropped.
#   workflow_dispatch  run it on demand.
on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    # Deliberately NOT in the letter-artifacts group: this job only reads the repo
    # and talks to external archives, so it cannot race the job that changes main.
    # Job-level so it also applies when release.yml calls this workflow.
    concurrency:
      group: archive-release-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Submit to public archives
        env:
          PYTHONUNBUFFERED: "1"
          # Optional. Without these, the Wayback step reports that it was skipped
          # and why; Software Heritage needs no credentials and always runs.
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python3 scripts/archive_release.py
